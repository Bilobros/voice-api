<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusAI - 3D Voice Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Segoe UI', sans-serif; }
        body { 
            background: radial-gradient(circle at 50% 10%, #1e1b4b 0%, #0f172a 60%, #020617 100%); 
            color: #f8fafc; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
        }
        .container { 
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid rgba(255, 255, 255, 0.12); 
            border-radius: 24px; 
            padding: 40px; 
            width: 100%; 
            max-width: 650px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 40px rgba(168, 85, 247, 0.15);
        }
        h1 { 
            text-align: center; 
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px; 
            font-size: 28px; 
            font-weight: 900;
        }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 700; color: #cbd5e1; font-size: 13px; text-transform: uppercase; }
        textarea, select, input[type="range"], input[type="email"], input[type="password"] { 
            width: 100%; 
            padding: 14px 16px; 
            background-color: #0b0f19; 
            border: 1px solid #334155; 
            border-radius: 12px; 
            color: #f1f5f9; 
            font-size: 15px; 
            box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.6);
            position: relative;
            z-index: 10;
        }
        textarea:focus, select:focus, input:focus { outline: none; border-color: #818cf8; }
        textarea { resize: vertical; height: 120px; }
        optgroup { background-color: #0f172a; color: #38bdf8; font-weight: bold; }
        option { background-color: #0f172a; color: #f1f5f9; padding: 5px; }
        .range-value { float: right; color: #38bdf8; font-weight: bold; }
        input[type="range"] { accent-color: #ec4899; cursor: pointer; padding: 5px 0; background: transparent; border: none; }
        
        button { 
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%); 
            color: white; border: none; padding: 15px; width: 100%; border-radius: 12px; 
            font-size: 16px; font-weight: 800; cursor: pointer; text-transform: uppercase;
            box-shadow: 0 6px 0 #4f46e5, 0 10px 20px rgba(168, 85, 247, 0.4);
        }
        button:hover { transform: translateY(-2px); }
        .audio-container { margin-top: 25px; text-align: center; background: #0b0f19; padding: 15px; border-radius: 14px; border: 1px solid #334155; }
        audio { width: 100%; margin-top: 10px; filter: invert(0.9) hue-rotate(180deg); }
        .switch-text { text-align: center; margin-top: 15px; font-size: 14px; color: #94a3b8; }
        .switch-text span { color: #38bdf8; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Nexus AI Studio</h1>

    <!-- Auth Section -->
    <div id="authBox">
        <h3 id="authTitle" style="text-align:center; margin-bottom:15px; color:#f1f5f9;">Member Login</h3>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="Enter your email">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password">
        </div>
        <button id="authBtn" onclick="handleAuth()">Login Now</button>
        <div class="switch-text" id="switchText">
            Don't have an account? <span onclick="toggleMode()">Sign Up (1499 PKR)</span>
        </div>
    </div>

    <!-- Main Tool Section (Hidden initially) -->
    <div id="toolSection" style="display:none;">
        <div class="form-group">
            <label for="text">Enter Your Script:</label>
            <textarea id="text" placeholder="Type or paste your text here..."></textarea>
        </div>

        <div class="form-group">
            <label for="voice">Select Professional Voice:</label>
            <select id="voice">
                <optgroup label="English Voices (US / UK / AU)">
                    <option value="en-US-AriaNeural">English (US) - Aria (Female)</option>
                    <option value="en-US-GuyNeural">English (US) - Guy (Male)</option>
                    <option value="en-US-JennyNeural">English (US) - Jenny (Female)</option>
                    <option value="en-US-SteffanNeural">English (US) - Steffan (Male)</option>
                    <option value="en-US-AnaNeural">English (US) - Ana (Child Female)</option>
                    <option value="en-GB-SoniaNeural">English (UK) - Sonia (Female)</option>
                    <option value="en-GB-RyanNeural">English (UK) - Ryan (Male)</option>
                    <option value="en-GB-LibbyNeural">English (UK) - Libby (Female)</option>
                    <option value="en-AU-NatashaNeural">English (Australia) - Natasha (Female)</option>
                    <option value="en-AU-WilliamNeural">English (Australia) - William (Male)</option>
                </optgroup>
                <optgroup label="Urdu Voices (Pakistan)">
                    <option value="ur-PK-AsadNeural">Urdu (Pakistan) - Asad (Male)</option>
                    <option value="ur-PK-UzmaNeural">Urdu (Pakistan) - Uzma (Female)</option>
                </optgroup>
                <optgroup label="Hindi Voices (India)">
                    <option value="hi-IN-SwaraNeural">Hindi (India) - Swara (Female)</option>
                    <option value="hi-IN-MadhurNeural">Hindi (India) - Madhur (Male)</option>
                    <option value="hi-IN-AnanyaNeural">Hindi (India) - Ananya (Female)</option>
                </optgroup>
            </select>
        </div>

        <div class="form-group">
            <label for="speed">Speed: <span id="speedVal" class="range-value">1.0x</span></label>
            <input type="range" id="speed" min="0.5" max="2.0" step="0.1" value="1.0" oninput="document.getElementById('speedVal').innerText = this.value + 'x'">
        </div>

        <div class="form-group">
            <label for="pitch">Pitch: <span id="pitchVal" class="range-value">0Hz</span></label>
            <input type="range" id="pitch" min="-20" max="20" step="1" value="0" oninput="document.getElementById('pitchVal').innerText = this.value + 'Hz'">
        </div>

        <button onclick="generateVoice()">Generate & Download Audio</button>

        <div class="audio-container" id="audioBox" style="display:none;">
            <label style="color:#38bdf8;">Generated Audio Preview:</label>
            <audio id="audioPlayer" controls></audio>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://voice-api-7asa.onrender.com";
    let isSignupMode = false;

    function toggleMode() {
        isSignupMode = !isSignupMode;
        document.getElementById('authTitle').innerText = isSignupMode ? "Create Account" : "Member Login";
        document.getElementById('authBtn').innerText = isSignupMode ? "Register & Pay" : "Login Now";
        document.getElementById('switchText').innerHTML = isSignupMode ? 
            'Already have an account? <span onclick="toggleMode()">Login here</span>' : 
            'Don\'t have an account? <span onclick="toggleMode()">Sign Up (1499 PKR)</span>';
    }

    async function handleAuth() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if(!email || !password) {
            alert('Please fill in all fields!');
            return;
        }

        const endpoint = isSignupMode ? '/api/signup' : '/api/login';

        try {
            const res = await fetch(API_URL + endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();

            if(!res.ok) throw new Error(data.detail || 'Authentication failed');

            if(isSignupMode) {
                alert(data.message);
                toggleMode();
            } else {
                alert('Login Successful!');
                document.getElementById('authBox').style.display = 'none';
                document.getElementById('toolSection').style.display = 'block';
            }
        } catch (err) {
            alert(err.message);
        }
    }

    async function generateVoice() {
        const text = document.getElementById('text').value;
        const voice = document.getElementById('voice').value;
        const speed = document.getElementById('speed').value;
        const pitch = document.getElementById('pitch').value;
        
        if (!text) { alert('Please enter text!'); return; }

        try {
            const response = await fetch(API_URL + '/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text, voice, speed: parseFloat(speed), pitch: parseInt(pitch) })
            });

            if (!response.ok) throw new Error('Generation failed');

            const blob = await response.blob();
            const audioUrl = URL.createObjectURL(blob);
            const player = document.getElementById('audioPlayer');
            player.src = audioUrl;
            document.getElementById('audioBox').style.display = 'block';
            player.play();
        } catch (error) {
            alert('Error generating audio.');
        }
    }
</script>

</body>
</html>
